services:
  mongo:
    image: mongo:7
    container_name: job-portal-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    volumes:
      - mongo_data:/data/db
    # Not published to the host by default — only the app needs to reach Mongo.
    # Uncomment to inspect the database with a local client.
    # ports:
    #   - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job-portal-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      UPLOADS_DIR: /app/uploads
    ports:
      - "3000:3000"
    volumes:
      # Uploaded resumes survive container rebuilds.
      - resume_uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
  resume_uploads:
