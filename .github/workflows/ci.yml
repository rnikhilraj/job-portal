name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first — no point burning
# minutes on a commit that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          # Matches the Dockerfile. Node 20 reached end of life in April 2026,
          # so neither CI nor the shipped image should still be on it.
          node-version: 22
          cache: npm

      # mongodb-memory-server downloads a mongod binary on first run; caching it
      # keeps CI from re-fetching ~80 MB on every push.
      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v5
        with:
          path: ~/.cache/mongodb-binaries
          key: mongo-binaries-${{ runner.os }}

      - run: npm ci

      # Fails the build on a known-vulnerable dependency. `npm audit` is advisory
      # by default and exits 0 on anything below the chosen level; --audit-level
      # is what makes it a gate rather than a report nobody reads. High and above
      # only, so a moderate advisory in a dev-only transitive dependency does not
      # block a release it cannot affect.
      - name: Audit dependencies
        if: '!cancelled()'
        run: npm audit --audit-level=high

      # Each gate runs even if an earlier one failed, so a single push reports
      # every problem at once rather than one per round trip.
      - name: Typecheck
        if: '!cancelled()'
        run: npm run typecheck

      - name: Lint
        if: '!cancelled()'
        run: npm run lint

      - name: Test
        if: '!cancelled()'
        run: npm run test:coverage

      - name: Build
        if: '!cancelled()'
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  docker:
    name: docker compose boots clean
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      # Proves the claim the README makes: a fresh clone plus one command
      # yields a healthy, seeded app with no manual setup.
      - name: Boot the stack from a clean slate
        run: |
          cp .env.example .env
          docker compose up --build -d

      - name: Wait for both services to report healthy
        run: |
          for i in $(seq 1 40); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' job-portal-app)" = "healthy" ]; then
              echo "app healthy after ${i}0s"; exit 0
            fi
            sleep 10
          done
          echo "app never became healthy"; docker compose logs app; exit 1

      - name: Verify the health endpoint and that seeding ran
        run: |
          curl -fsS http://localhost:3000/api/health | tee /dev/stderr | grep -q '"database":"connected"'
          docker compose logs app | grep -q '\[seed\] complete'

      # The e2e suite runs against the stack this job has already booted and
      # proven healthy, rather than starting a second copy of the app. Only
      # chromium is installed: the suite asserts behaviour, not rendering, so a
      # second engine would double the minutes for no extra signal.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install the e2e runner
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the end-to-end suite
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # The image is already built and proven to boot by the steps above, so it
      # is scanned here rather than in a separate job that would rebuild it.
      # Scoped to HIGH and CRITICAL: the base image carries a long tail of
      # unfixed low-severity CVEs, and failing on those trains people to ignore
      # the result. `ignore-unfixed` drops findings with no available patch,
      # which are noise rather than an action.
      - name: Scan the image for known vulnerabilities
        if: '!cancelled()'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: job-portal-app
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
